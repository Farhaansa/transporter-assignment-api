spring.application.name=transporter-assignment-api
server.port=${PORT:8080}

# Respect X-Forwarded-* headers from the hosting proxy, so Swagger UI calls the API over https.
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
server.error.include-message=never

# Quotes and costs are whole numbers: reject 1.5 instead of silently truncating it.
spring.jackson.deserialization.accept-float-as-int=false

# Exact search (proven minimum cost) is used while C(N, k) stays at or below this many combinations.
# Above it, the greedy heuristic runs: its cost may be higher than the minimum and it may miss a cover that exists.
solver.max-combinations=200000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
