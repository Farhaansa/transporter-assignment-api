spring.application.name=transporter-assignment-api
server.port=${PORT:8080}

# Respect X-Forwarded-* headers from the hosting proxy, so Swagger UI calls the API over https.
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
server.error.include-message=never

# Quotes and costs are whole numbers: reject 1.5 instead of silently truncating it.
spring.jackson.deserialization.accept-float-as-int=false

# Exact branch-and-bound search (proven minimum cost when it completes). It stops at whichever budget runs out
# first; the problem is NP-hard, so these bound the worst case.
solver.max-search-nodes=5000000
solver.max-time-ms=10000
# Coverage-first local search, used only when the exact search stops at a budget. Its answers are labelled
# HEURISTIC: the cost may be higher than the minimum, and finding no cover does not prove none exists.
solver.heuristic-time-ms=3000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
